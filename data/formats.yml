# Canonical format registry. This file is the single source of truth for
# format IDs, extensions, MIME types, aliases, and declared read/write support.
# External engine availability is reported separately at runtime.
formats:
  # image (12)
  png:
    category: image
    extensions: [png]
    mime: image/png
    read: true
    write: true
    aliases: []
  jpg:
    category: image
    extensions: [jpg, jpeg, jpe, jfif]
    mime: image/jpeg
    read: true
    write: true
    aliases: [jpeg, jpe, jfif]
