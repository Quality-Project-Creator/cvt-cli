name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run core tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build cvt-cli.gemspec

  integration-linux:
    name: integration (ubuntu-latest, Ruby 3.4)
    runs-on: ubuntu-latest
    env:
      CVT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install engine packages
        run: |
          sudo apt-get update
          # libvips42 was renamed libvips42t64 on Ubuntu 24.04; accept either.
          sudo apt-get install -y libvips42 || sudo apt-get install -y libvips42t64
          sudo apt-get install -y imagemagick ffmpeg pandoc poppler-utils libreoffice
          # Calibre is optional and intentionally not installed; its tests skip.
      - name: Install dependencies
        run: bundle install
      - name: Run integration tests
        run: CVT_INTEGRATION=1 bundle exec rake test

  package:
    name: package (gem build and clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build gem
        run: gem build cvt-cli.gemspec
      - name: Install gem into a clean GEM_HOME
        run: |
          mkdir -p "$RUNNER_TEMP/cvt-gem-home"
          GEM_HOME="$RUNNER_TEMP/cvt-gem-home" GEM_PATH="$RUNNER_TEMP/cvt-gem-home" \
            gem install --no-document ./cvt-cli-*.gem
      - name: Smoke test the installed gem
        run: |
          export GEM_HOME="$RUNNER_TEMP/cvt-gem-home"
          export GEM_PATH="$RUNNER_TEMP/cvt-gem-home"
          export PATH="$RUNNER_TEMP/cvt-gem-home/bin:$PATH"
          cvt --version
          cvt --formats
          cvt --doctor
