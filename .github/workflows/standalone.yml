name: Standalone

"on":
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TEBAKO_VERSION: "2.8.73"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            triplet: linux-gnu-x86_64
          - os: macos-latest
            platform: macos-arm64
            triplet: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
            triplet: windows-ucrt64
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Tebako (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/.local/bin"
          for binary in tebako tebako-bootstrap tebako-pkg tebako-shim tfs; do
            curl -fsSL -o "$HOME/.local/bin/$binary" \
              "https://github.com/tamatebako/tebako/releases/download/v$TEBAKO_VERSION/$binary-$TEBAKO_VERSION-${{ matrix.triplet }}"
            chmod 0755 "$HOME/.local/bin/$binary"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Tebako (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\tebako\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($binary in @("tebako", "tebako-bootstrap", "tebako-pkg", "tebako-shim", "tfs")) {
            $url = "https://github.com/tamatebako/tebako/releases/download/v$env:TEBAKO_VERSION/$binary-$env:TEBAKO_VERSION-windows-ucrt64.exe"
            Invoke-WebRequest -Uri $url -OutFile "$dest\$binary.exe"
          }
          echo "$dest" >> $env:GITHUB_PATH

      - name: Install UPX (best effort)
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y upx-ucl
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install upx -y --no-progress
          fi

      - name: Build standalone
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby script/build_standalone.rb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.platform }}
          path: |
            dist/cvt-*
            dist/sizes-*.txt
          if-no-files-found: error

  release:
    name: release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build gem
        run: gem build cvt-cli.gemspec

      - name: Combine checksums and collect sizes
        run: |
          cd artifacts
          cat *.sha256 | sort > SHA256SUMS
          cat sizes-*.txt > ../sizes.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          {
            echo "Self-contained executables: the Ruby runtime and all conversion gems are inside each file."
            echo "External engines (FFmpeg, libvips, Pandoc, LibreOffice, Calibre, Poppler, librsvg) remain optional system packages."
            echo
            echo "### Standalone build measurements"
            echo '```'
            cat sizes.txt
            echo '```'
          } > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "CVT $TAG" --notes-file notes.md
          gh release upload "$TAG" artifacts/cvt-* artifacts/SHA256SUMS cvt-cli-*.gem --clobber
