    write: true
    aliases: []
  pnm:
    category: image
    extensions: [pnm, ppm, pgm, pbm]
    mime: image/x-portable-anymap
    read: true
    write: true
    aliases: [ppm, pgm, pbm]
  tga:
    category: image
    extensions: [tga]
    mime: image/x-tga
    read: true
    write: true
    aliases: []

