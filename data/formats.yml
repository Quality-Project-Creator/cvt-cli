    read: true
    write: true
    aliases: [tif]
  ico:
    category: image
    extensions: [ico]
    mime: image/vnd.microsoft.icon
    read: true
    write: true
    aliases: []
  svg:
    category: image
    extensions: [svg]
    mime: image/svg+xml
    read: true
    write: false
    aliases: []
  avif:
    category: image
    extensions: [avif]
    mime: image/avif
    read: true
    write: true
    aliases: []
  heic:
